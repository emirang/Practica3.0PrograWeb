<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 3.3 - Juego de Craps con Apuestas</title>
    <style>
        body {
            font-family: Impact, sans-serif;
            background-color: #87CEFA;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        #tablero {
            background-color: rgba(255, 255, 255, 0.9);
            border: 3px solid #000;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        .marcador {
            font-size: 1.3em;
            margin: 15px 0;
        }
        .charlas {
            font-style: italic;
            color: #0056b3;
            margin: 15px 0;
            font-size: 1.2em;
        }
        button {
            padding: 12px 25px;
            font-size: 1.2em;
            font-family: Impact, sans-serif;
            background-color: #ff4500;
            color: white;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #cc3700;
        }
        button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
            border-color: #444;
        }
    </style>
</head>
<body>

    <div id="tablero">
        <h1>JUEGO DE CRAPS</h1>
        <div class="marcador" id="displaySaldo">Saldo en el Banco: $1000</div>
        
        <button id="btnJugar" onclick="jugarCraps()">Lanzar Dados</button>
        
        <div class="marcador" id="displayDados"></div>
        <div class="marcador" id="displayEstado">¡Presione el botón para iniciar!</div>
        <div class="charlas" id="displayConversacion"></div>
    </div>

    <script>
        var saldoBanco = 1000;
        var estadoJuego = 0;
        var punto = 0;
        var apuestaActual = 0;

        function jugarCraps() {
            if (saldoBanco <= 0) {
                document.getElementById("displayEstado").innerHTML = "¡Lo siento. Está en bancarrota!";
                return;
            }

            if (estadoJuego === 0) {
                var entradaValida = false;
                
                do {
                    var entrada = prompt("Su saldo actual es $" + saldoBanco + ".\nIntroduzca su apuesta:", "100");
                    
                    if (entrada === null) return; 
                    
                    apuestaActual = parseInt(entrada);
                    
                    if (!isNaN(apuestaActual) && apuestaActual > 0 && apuestaActual <= saldoBanco) {
                        entradaValida = true;
                    } else {
                        alert("Apuesta inválida. Debe ser un número mayor a 0 y no exceder su saldo de $" + saldoBanco + ".");
                    }
                } while (!entradaValida);
            }

            var sumaDados = lanzarDados();

            if (estadoJuego === 0) {
                if (sumaDados === 7 || sumaDados === 11) {
                    procesarVictoria();
                } else if (sumaDados === 2 || sumaDados === 3 || sumaDados === 12) {
                    procesarDerrota();
                } else {
                    estadoJuego = 1;
                    punto = sumaDados;
                    document.getElementById("displayEstado").innerHTML = "El Punto es <strong>" + punto + "</strong>. Siga lanzando.";
                    actualizarConversacion();
                }
            } else {
                if (sumaDados === punto) {
                    procesarVictoria();
                } else if (sumaDados === 7) {
                    procesarDerrota();
                } else {
                    document.getElementById("displayEstado").innerHTML = "Buscando el Punto (<strong>" + punto + "</strong>)...";
                    actualizarConversacion();
                }
            }
        }

        function lanzarDados() {
            var dado1 = Math.floor(Math.random() * 6) + 1;
            var dado2 = Math.floor(Math.random() * 6) + 1;
            var suma = dado1 + dado2;
            
            document.getElementById("displayDados").innerHTML = "Lanzamiento: " + dado1 + " y " + dado2 + " = <strong>" + suma + "</strong>";
            return suma;
        }

        function procesarVictoria() {
            saldoBanco += apuestaActual;
            estadoJuego = 0;
            document.getElementById("displayEstado").innerHTML = "¡Ganó $" + apuestaActual + "!";
            actualizarInterfaz();
        }

        function procesarDerrota() {
            saldoBanco -= apuestaActual;
            estadoJuego = 0; 
            
            if (saldoBanco === 0) {
                document.getElementById("displayEstado").innerHTML = "Perdió la ronda. <br><span style='color:red;'>¡Lo siento. Está en bancarrota!</span>";
                document.getElementById("btnJugar").disabled = true;
                document.getElementById("displayConversacion").innerHTML = "";
            } else {
                document.getElementById("displayEstado").innerHTML = "Perdió $" + apuestaActual + " en esta ronda.";
                actualizarInterfaz();
            }
        }

        function actualizarInterfaz() {
            document.getElementById("displaySaldo").innerHTML = "Saldo en el Banco: $" + saldoBanco;
            actualizarConversacion();
        }

        function actualizarConversacion() {
            var mensaje = generarConversacion();
            document.getElementById("displayConversacion").innerHTML = mensaje;
        }

        function generarConversacion() {
            var frases = [
                "¿Así que se va a quedar en bancarrota?",
                "¡Vamos, arriésguese!",
                "¡Está teniendo éxito! ¡Ahora es momento de cambiar sus fichas!",
                "La suerte favorece a los valientes."
            ];
            var indiceAleatorio = Math.floor(Math.random() * frases.length);
            return frases[indiceAleatorio];
        }
    </script>
</body>
</html>
