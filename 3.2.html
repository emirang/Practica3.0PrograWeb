<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 3.3 - Juego de Craps con Apuestas</title>
    <style>
        body {
            /* Estilo solicitado: fuente Impact y fondo celeste */
            font-family: Impact, sans-serif;
            background-color: #87CEFA;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        #tablero {
            background-color: rgba(255, 255, 255, 0.9);
            border: 3px solid #000;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }
        .marcador {
            font-size: 1.3em;
            margin: 15px 0;
            font-family: Arial, sans-serif; /* Se mantiene Arial para legibilidad de textos pequeños */
        }
        .charlas {
            font-style: italic;
            color: #0056b3;
            margin: 15px 0;
            font-size: 1.2em;
        }
        button {
            padding: 12px 25px;
            font-size: 1.2em;
            font-family: Impact, sans-serif;
            background-color: #ff4500;
            color: white;
            border: 2px solid #000;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #cc3700;
        }
        button:disabled {
            background-color: #555;
            color: #999;
            cursor: not-allowed;
            border-color: #444;
        }
    </style>
</head>

                    apuestaActual = parseInt(entrada);
                    
                    // Validar que sea número, mayor a 0 y menor o igual al saldo

                        entradaValida = true;
                    } else {
                        alert("Apuesta inválida. Debe ser un número mayor a 0 y no exceder su saldo de $" + saldoBanco + ".");
